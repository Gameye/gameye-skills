name: Bug report
description: A skill gave your agent wrong facts, bad code or steps that don't work.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste API tokens, session IDs, IP addresses or other private data.** Issues are public. Replace them with placeholders such as `<token>` or `<session-id>`.
  - type: dropdown
    id: skill
    attributes:
      label: Skill
      options:
        - gameye
        - gameye-containerize
        - gameye-godot-server
        - gameye-launch
        - gameye-local-testing
        - gameye-matchmaking
        - gameye-server-design
        - gameye-sessions-api
        - gameye-unity-server
        - gameye-unreal-server
        - gameye-web-server
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version
      description: The `metadata.version` in the skill's `SKILL.md` frontmatter, or the `Pack version` line in `skills/gameye/SKILL.md`.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and install method
      description: The coding agent you used and how you installed the skills.
      placeholder: Claude Code plugin, Cursor via npx skills, ...
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What the agent did or said because of the skill. Quote the wrong fact, code or step.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
      description: The correct behaviour. If it's an API fact, cite the Gameye docs or the API's `/openapi.yaml`.
    validations:
      required: true
  - type: input
    id: error
    attributes:
      label: Error message or HTTP status
      description: Optional. With private data removed.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I've removed tokens, session IDs, IP addresses and other private data from this report.
          required: true

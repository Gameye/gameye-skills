name: Feature request
description: Suggest a new skill, engine, workflow or topic the skills should cover.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task you or your agent wanted to complete, and where the current skills fall short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: The skill, guidance or example you'd like. Mention the engine, language or Gameye API operation involved.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you use today
